<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="200" viewBox="0 0 1390 200" role="img" aria-labelledby="title desc">
  <title id="title">Example foreign-property spreadsheet</title>
  <desc id="desc">One French rental receipt in euros, showing the original amount, exchange rate, rate date and source, GBP amount and country code.</desc>
  <rect width="1390" height="200" fill="#f3f5f8"/>
