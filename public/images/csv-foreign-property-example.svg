    <text x="30" y="107">1</text><text x="60" y="107">recordDate</text><text x="190" y="107">recordType</text><text x="300" y="107">category</text><text x="420" y="107">sourceAmount</text><text x="550" y="107">sourceCurrency</text><text x="700" y="107">amountGbp</text><text x="815" y="107">exchangeRate</text><text x="930" y="107">exchangeRateDate</text><text x="1065" y="107">exchangeRateSource</text><text x="1205" y="101">foreignProperty</text><text x="1205" y="115">CountryCode</text>
    <text x="30" y="146">2</text><text x="60" y="146">2026-04-08</text><text x="190" y="146">income</text><text x="300" y="146">rentIncome</text><text x="420" y="146">100.00</text><text x="550" y="146">EUR</text><text x="700" y="146">85.00</text><text x="815" y="146">0.85</text><text x="930" y="146">2026-04-08</text><text x="1065" y="146">Bank statement</text><text x="1205" y="146">FRA</text>
