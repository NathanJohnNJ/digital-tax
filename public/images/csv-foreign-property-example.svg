  <rect x="20" y="45" width="1350" height="38" fill="#e9eef5"/>
  <rect x="20" y="83" width="1350" height="38" fill="#dcebe1"/>
  <path d="M55 45V161 M185 45V161 M295 45V161 M415 45V161 M545 45V161 M695 45V161 M810 45V161 M925 45V161 M1060 45V161 M1200 45V161 M20 83H1370 M20 121H1370" stroke="#aab3c0"/>
  <g font-family="Arial,sans-serif" font-size="12" fill="#273446">
